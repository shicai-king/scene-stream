[project]
name = "longlive-rooms"
version = "0.1.0"
description = "Shared interactive AI livestream rooms for reproducible classroom demos"
requires-python = ">=3.12,<3.13"
dependencies = [
  "anyio==4.16.0",
  "fastapi==0.115.12",
  "uvicorn[standard]==0.34.2",
  "httpx==0.28.1",
  "pydantic==2.11.5",
  "PyYAML==6.0.2",
  "Pillow==11.2.1",
  "numpy==2.2.6",
  "aiortc==1.13.0",
  "av==14.2.0",
]

[dependency-groups]
dev = ["pytest==8.3.5", "pytest-asyncio==0.26.0", "playwright==1.58.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.uv]
package = false
