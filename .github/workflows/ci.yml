name: Software and Docker checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.8'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.16.0'
          cache: npm
      - run: python -m pip install uv==0.9.11
      - run: uv sync --frozen
      - run: python scripts/check_repository.py
      - run: uv run pytest -q
      - run: npm ci --no-audit --no-fund && npm run build
      - run: docker compose config --quiet
      - run: docker build -t longlive-rooms:ci .
      - name: Check real Mock transport in the image
        run: |
          docker run -d --name longlive-ci -p 127.0.0.1:18080:8080 longlive-rooms:ci
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:18080/healthz >/dev/null; then break; fi
            sleep 1
          done
          uv run python scripts/smoke_api.py --url http://127.0.0.1:18080 --rooms 2 --seconds 5 --timeout 120 --output /tmp/longlive-ci.json
      - name: Remove test container
        if: always()
        run: docker rm -f longlive-ci 2>/dev/null || true
