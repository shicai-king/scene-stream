name: longlive-mock
services:
  hub:
    build: .
    image: longlive-rooms:0.1.0
    init: true
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    ports:
      - '127.0.0.1:8080:8080'
    environment:
      MOCK_WORKER_COUNT: '${MOCK_WORKER_COUNT:-2}'
      AUTO_START: 'true'
      LOG_PATH: /app/logs/events.jsonl
    volumes:
      - ./logs:/app/logs
